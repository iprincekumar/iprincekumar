<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F00FF">
        <animate attributeName="stop-color" values="#7F00FF;#5B21B6;#00C6FF;#7F00FF" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00C6FF">
        <animate attributeName="stop-color" values="#00C6FF;#7F00FF;#5B21B6;#00C6FF" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="90" cy="220" r="3" opacity="0"><animate attributeName="cy" values="230;40" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="220" r="2" opacity="0"><animate attributeName="cy" values="230;30" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="220" r="3" opacity="0"><animate attributeName="cy" values="230;50" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="220" r="2" opacity="0"><animate attributeName="cy" values="230;30" dur="6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="220" r="2" opacity="0"><animate attributeName="cy" values="230;20" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moving waves -->
    <g>
      <path fill="#ffffff" fill-opacity="0.10" d="M0 215 Q150 185 300 215 T600 215 T900 215 T1200 215 T1500 215 T1800 215 T2100 215 T2400 215 V280 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="8s" repeatCount="indefinite"/>
      </path>
      <path fill="#ffffff" fill-opacity="0.16" d="M0 240 Q150 215 300 240 T600 240 T900 240 T1200 240 T1500 240 T1800 240 T2100 240 T2400 240 V280 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
      <text x="600" y="120" font-size="64" font-weight="800" letter-spacing="1" opacity="0">Prince Kumar
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
        <animate attributeName="y" from="140" to="120" dur="1.2s" fill="freeze"/>
      </text>
      <text x="600" y="170" font-size="24" font-weight="500" opacity="0">AI Automation &amp; Full-Stack Developer
        <animate attributeName="opacity" from="0" to="0.95" begin="0.6s" dur="1.2s" fill="freeze"/>
      </text>
      <rect x="520" y="188" width="160" height="3" rx="1.5" opacity="0">
        <animate attributeName="opacity" from="0" to="0.85" begin="1s" dur="1s" fill="freeze"/>
        <animate attributeName="width" from="0" to="160" begin="1s" dur="1s" fill="freeze"/>
        <animate attributeName="x" from="600" to="520" begin="1s" dur="1s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>
